<!DOCTYPE html>
<html lang="en" class="error-document">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 · Page not found | stephc.net</title>
    <link rel="stylesheet" href="/stylesheet.css">
    <link rel="icon" href="/favicon.svg">
    <style>
      .error-document {
        scrollbar-gutter: stable;
      }

      .error-layout {
        width: auto;
        max-width: none;
        padding-inline: 0;
      }

      .site-header .nav-row {
        min-block-size: 2.1rem;
      }

      .error-content {
        width: 75%;
        max-width: 1000px;
        margin-inline: auto;
      }

      .error-page {
        padding-block: 4.25rem 2.5rem;
      }

      .error-page .subtitle {
        max-width: none;
        margin-bottom: 1.5rem;
      }

      .error-illustration {
        display: block;
        width: auto;
        height: auto;
        image-rendering: pixelated;
      }

      @media (max-width: 768px) {
        .site-header .nav-row {
          grid-template-rows: 44px;
        }

        /* Keep the title aligned with the first row of the mobile header. */
        .site-header .nav-row::after {
          content: "\00a0";
          grid-area: 1 / 3;
          display: flex;
          align-items: center;
          block-size: 100%;
          font-size: 0.75rem;
          line-height: 1.3;
        }

        .error-content {
          width: 80%;
        }

        .error-page {
          padding-block-start: 5rem;
        }
      }
    </style>
  </head>

  <body class="error-layout">
    <div class="site-header-frame">
      <header class="site-header">
        <div class="nav-row">
          <a class="blog-title" href="/">[stephc.net]</a>
        </div>
        <hr>
      </header>
    </div>

    <div class="error-content">
      <main class="error-page">
        <h1 id="title" aria-label="404. Page not found">404</h1>
        <p class="subtitle" id="error-message">The page is gone. Apparently.</p>
        <img class="error-illustration" src="/images/lz8b.gif" width="415" height="237" alt="A grainy collage of William Gates III, Seymour Cray, Choron, a naked rat and other oddities.">
      </main>

      <footer class="site-footer">
        <ul>
          <li>Copyright&nbsp;2026 Stephane&nbsp;Cocquereaumont.</li>
          <li>Made with <a href="https://github.com/stephc-int13/carnet">Carnet</a>&nbsp;&#10010;&nbsp;<a href="https://crayfish.dev">Crayfish</a></li>
        </ul>
      </footer>
    </div>

    <script>
      const message = document.getElementById("error-message");
      const messages = [
        message.textContent,
        "This URL is dead, just like Charlie Kirk.",
        "Someone made a mistake.",
        "You are not supposed to see this.",
        "Tout abus sera puni.",
        "No comment.",
        "Fantome d'une page disparue.",
        "Epstein didn't kill himself.",
        "Oh long johnson!",
        "I am sorry, Dave. I'm afraid I can't do that.",
        "The page you are looking for is not here. It may have been moved, deleted, or never existed in the first place. Remember to check your spelling and try again.",
        "Unfortunately, the page you are looking for is not available. Please check the URL and try again.",
        "Sacre bleu! This page has vanished into the digital ether.",
        "Oops! It seems you've stumbled upon a page that doesn't exist. Please check the URL.",
        "Why did the chicken cross the road? To get to the 404 page!",
        "Knock knock. Who's there?",
        "Well, this is awkward. The page you requested cannot be found.",
        "Hop on pop, this page is gone. Please check the URL and try again.",
        "What are we doing here? This page is missing. Please check the URL and try again.",
        "What are we doing tonight, brain?", 
        "What's up, Doc? This page is not available.",       
      ];
      message.textContent = messages[Math.floor(Math.random() * messages.length)];
    </script>
  </body>
</html>
