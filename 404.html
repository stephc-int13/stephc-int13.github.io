<!DOCTYPE html>
<html lang="en" class="error-document">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 · Page not found | stephc.net</title>
    <link rel="stylesheet" href="/stylesheet.css">
    <link rel="icon" href="/favicon.svg">
    <style>
      .error-document {
        scrollbar-gutter: stable;
      }

      .error-layout {
        width: auto;
        max-width: none;
        padding-inline: 0;
      }

      .site-header .nav-row {
        min-block-size: 2.1rem;
      }

      .error-content {
        width: 75%;
        max-width: 1000px;
        margin-inline: auto;
      }

      .error-page {
        padding-block: 4.25rem 2.5rem;
      }

      .error-page .subtitle {
        max-width: none;
        margin-bottom: 1.5rem;
      }

      .error-illustration {
        display: block;
        width: auto;
        height: auto;
        image-rendering: pixelated;
      }

      @media (max-width: 768px) {
        .site-header .nav-row {
          grid-template-rows: 44px;
        }

        /* Keep the title aligned with the first row of the mobile header. */
        .site-header .nav-row::after {
          content: "\00a0";
          grid-area: 1 / 3;
          display: flex;
          align-items: center;
          block-size: 100%;
          font-size: 0.75rem;
          line-height: 1.3;
        }

        .error-content {
          width: 80%;
        }

        .error-page {
          padding-block-start: 5rem;
        }
      }
    </style>
  </head>

  <body class="error-layout">
    <div class="site-header-frame">
      <header class="site-header">
        <div class="nav-row">
          <a class="blog-title" href="/">[stephc.net]</a>
        </div>
        <hr>
      </header>
    </div>

    <div class="error-content">
      <main class="error-page">
        <h1 id="title" aria-label="404. Page not found">404</h1>
        <p class="subtitle" id="error-message">The page is gone. The GIF survived.</p>
        <img class="error-illustration" src="/images/lz8b.gif" width="415" height="237" alt="A grainy collage of a poodle, a rat, mugshots and other oddities.">
      </main>

      <footer class="site-footer">
        <ul>
          <li>Copyright&nbsp;2026 Stephane&nbsp;Cocquereaumont.</li>
          <li>Made with <a href="https://github.com/stephc-int13/carnet">Carnet</a>&nbsp;&#10010;&nbsp;<a href="https://crayfish.dev">Crayfish</a></li>
        </ul>
      </footer>
    </div>

    <script>
      const message = document.getElementById("error-message");
      const messages = [
        message.textContent,
        "This URL has been declared legally dead.",
        "The page was last seen in the company of a broken link.",
        "The page had a brief and entirely undocumented life.",
        "The link led nowhere. At least the poodle showed up.",
        "The page is missing. The rat declined to comment.",
        "Nothing at this address but a GIF with a suspicious alibi."
      ];
      message.textContent = messages[Math.floor(Math.random() * messages.length)];
    </script>
  </body>
</html>
